<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shalimar Real App - Generated from Razor</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .app-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .app-header { text-align: center; margin-bottom: 40px; }
        .app-header h1 { font-size: 32px; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .app-header p { color: #888; }
        .app-main { display: grid; gap: 30px; }
        .app-footer { text-align: center; margin-top: 40px; color: #666; font-size: 14px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .card-title { font-size: 20px; font-weight: 600; }
        .card-subtitle { color: #888; font-size: 14px; margin-top: 4px; }
        .card-body { padding: 24px; }
        .profile-content { }
        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; }
        .avatar-image { width: 100%; height: 100%; object-fit: cover; }
        .avatar-fallback { font-size: 28px; font-weight: bold; color: white; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.success { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .stats-row { display: flex; gap: 30px; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .stat-item { text-align: center; flex: 1; }
        .stat-value { display: block; font-size: 24px; font-weight: bold; color: #00d4ff; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
        .profile-bio { margin-bottom: 20px; }
        .profile-bio p { color: #aaa; line-height: 1.6; }
        .skills-list { margin-bottom: 24px; }
        .skills-title { font-size: 14px; color: #888; margin-bottom: 12px; text-transform: uppercase; }
        .skills-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; }
        .profile-actions { display: flex; gap: 12px; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .source-info { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); border-radius: 12px; padding: 20px; margin-top: 30px; text-align: center; }
        .source-info code { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
// ================================================================
// ALL CODE BELOW IS GENERATED BY SHALIMAR COMPILER FROM .razor FILES
// NO HAND-WRITTEN TYPESCRIPT - ONLY COMPILER OUTPUT
// ================================================================

// Generated from Badge.razor
function Badge(props) {
  return (
    <span className={`badge ${props.Variant}`}>
      {props.Text}
    </span>
  );
}

// Generated from Avatar.razor
function Avatar(props) {
  return (
    <div className="avatar">
      {(props.ImageUrl) && (
        <img src={props.ImageUrl} alt={props.Alt} className="avatar-image" />
      )}
      {(!props.ImageUrl) && (
        <span className="avatar-fallback">{props.Initials}</span>
      )}
    </div>
  );
}

// Generated from StatItem.razor
function StatItem(props) {
  return (
    <div className="stat-item">
      <span className="stat-value">{props.Value}</span>
      <span className="stat-label">{props.Label}</span>
    </div>
  );
}

// Generated from StatsRow.razor
function StatsRow(props) {
  return (
    <div className="stats-row">
      {props.Stats.map((stat, index) => (
        <StatItem key={index} Value={stat.Value} Label={stat.Label} />
      ))}
    </div>
  );
}

// Generated from SkillTag.razor
function SkillTag(props) {
  return (
    <span className="skill-tag">{props.Name}</span>
  );
}

// Generated from SkillsList.razor
function SkillsList(props) {
  return (
    <div className="skills-list">
      <h4 className="skills-title">{props.Title}</h4>
      <div className="skills-container">
        {props.Skills.map((skill, index) => (
          <SkillTag key={index} Name={skill} />
        ))}
      </div>
    </div>
  );
}

// Generated from Button.razor
function Button(props) {
  return (
    <button className={`btn btn-${props.Variant}`} onClick={props.OnClick} disabled={props.Disabled}>
      {props.Children}
    </button>
  );
}

// Generated from Card.razor
function Card(props) {
  return (
    <div className="card">
      {(props.Title) && (
        <div className="card-header">
          <h3 className="card-title">{props.Title}</h3>
          {(props.Subtitle) && (
            <p className="card-subtitle">{props.Subtitle}</p>
          )}
        </div>
      )}
      <div className="card-body">
        {props.children}
      </div>
    </div>
  );
}

// Generated from UserProfile.razor
function UserProfile(props) {
  return (
    <Card Title={props.Name} Subtitle={props.JobTitle}>
      <div className="profile-content">
        <div className="profile-header">
          <Avatar ImageUrl={props.AvatarUrl} Initials={props.Initials} Alt={props.Name} />
          {(props.IsVerified) && (
            <Badge Text="Verified" Variant="success" />
          )}
        </div>
        <StatsRow Stats={props.Stats} />
        <div className="profile-bio">
          <p>{props.Bio}</p>
        </div>
        <SkillsList Title="Skills" Skills={props.Skills} />
        <div className="profile-actions">
          <Button Variant="primary" OnClick={props.OnFollow}>Follow</Button>
          <Button Variant="secondary" OnClick={props.OnMessage}>Message</Button>
        </div>
      </div>
    </Card>
  );
}

// Generated from App.razor
function App(props) {
  return (
    <div className="app-container">
      <header className="app-header">
        <h1>{props.Title}</h1>
        <p>{props.Description}</p>
      </header>
      <main className="app-main">
        {props.Users.map((user, index) => (
          <UserProfile key={index} {...user} />
        ))}
      </main>
      <footer className="app-footer">
        <p>Generated from Razor by Shalimar Compiler</p>
      </footer>
      <div className="source-info">
        <p><strong>10 Razor Components</strong> → <strong>10 TSX Files</strong> → <strong>Running React App</strong></p>
        <p style={{marginTop: '10px', color: '#888'}}>No hand-written TypeScript. All code generated by <code>Shalimar.Razor</code></p>
      </div>
    </div>
  );
}

// Sample data
const appData = {
  Title: "Shalimar Real App",
  Description: "All components generated from .razor files - no hand-written TypeScript",
  Users: [
    {
      Name: "Alex Johnson",
      JobTitle: "Senior Software Engineer",
      AvatarUrl: "",
      Initials: "AJ",
      IsVerified: true,
      Bio: "Passionate about building scalable systems. 10+ years in full-stack development with React, .NET, and cloud architecture.",
      Stats: [
        { Value: "47", Label: "Projects" },
        { Value: "2.3k", Label: "Followers" },
        { Value: "4.9", Label: "Rating" }
      ],
      Skills: ["React", "TypeScript", "C#", ".NET", "Azure", "Node.js"],
      OnFollow: () => alert("Following Alex!"),
      OnMessage: () => alert("Message Alex!")
    },
    {
      Name: "Sarah Chen",
      JobTitle: "Product Designer",
      AvatarUrl: "",
      Initials: "SC",
      IsVerified: false,
      Bio: "Design systems enthusiast. Creating beautiful, accessible interfaces that users love.",
      Stats: [
        { Value: "32", Label: "Projects" },
        { Value: "1.8k", Label: "Followers" },
        { Value: "4.7", Label: "Rating" }
      ],
      Skills: ["Figma", "UI/UX", "Design Systems", "Prototyping"],
      OnFollow: () => alert("Following Sarah!"),
      OnMessage: () => alert("Message Sarah!")
    }
  ]
};

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App {...appData} />);
    </script>
</body>
</html>
